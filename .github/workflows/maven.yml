name: Java CI with Maven

on:
  push:
    branches: [ "deploy" ]
  pull_request:
    branches: [ "deploy" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: mpf_labs
          POSTGRES_USER: mpf_user
          POSTGRES_PASSWORD: mpf_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mpf_user -d mpf_labs"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/mpf_labs
      SPRING_DATASOURCE_USERNAME: mpf_user
      SPRING_DATASOURCE_PASSWORD: mpf_pass

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package --file pom.xml
